name: Unit Tests

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    types: [opened, reopened]
    paths-ignore:
      - '**.md'

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
        node:
          - '22.x'
          - '24.x'
      fail-fast: false
    name: node-${{ matrix.node }}/${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
    - name: CPAN Cache
      id: cpan-cache
      uses: actions/cache@v6
      with:
        path: thirdparty
        key: ${{ matrix.os }}-cpan-${{ hashFiles('**/cpanfile') }}
    - name: Node Cache
      id: node-cache
      uses: actions/cache@v6
      with:
        path: frontend/node_modules
        key: ${{ matrix.os }}-node-${{ matrix.node }}-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ matrix.os }}-node-${{ matrix.node }}-
    - name: Install OS dependencies
      run: sudo apt-get update && sudo apt-get install -yq build-essential libqrencode-dev pkg-config gettext
    - name: Bootstrap
      run: ./bootstrap
    - name: Configure
      run: ./configure --prefix=$HOME/test-install
    - name: Make
      run: make
    - name: Test
      run: |
          cp etc/wgwrangler.dist.yaml  etc/wgwrangler.yaml
          make test
    - name: Cache Prep
      run: |
        rm thirdparty/Makefile* thirdparty/cpan*snapshot
